<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Calc</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>My Calc</h1>
        <h3>Dinesh Kushwaha</h3>
    </header>
    <main>
        <div class="main">
            <div class="screen" id="screen"></div>
            <div class="btn">
                <button class="btns" data-value="1">1</button>
                <button class="btns" data-value="2">2</button>
                <button class="btns" data-value="c">C</button>
                <button class="btns" data-value="3">3</button>
                <button class="btns" data-value="4">4</button>
                <button class="btns" data-value="*">x</button>
                <button class="btns" data-value="5">5</button>
                <button class="btns" data-value="6">6</button>
                <button class="btns" data-value="/">/</button>
                <button class="btns" data-value="7">7</button>
                <button class="btns" data-value="8">8</button>
                <button class="btns" data-value="-">-</button>
                <button class="btns" data-value="9">9</button>
                <button class="btns" data-value="0">0</button>
                <button class="btns" data-value="+">+</button>
                <button class="btns c-btn" data-value="=">=</button>
            </div>
        </div>
    </main>
    <footer>
        <div>DINESH KUSHWAHA</div>
    </footer>
    <script src="script.js"></script>
</body>
</html>
