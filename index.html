<!DOCTYPE html>

    <link rel="stylesheet" href="style.css">
</head>

        <h1>My Calc</h1>
        <h3>Dinesh Kushwaha</h3>

            <div class="btn">
                <button class="1st">1</button>
                <button class="2nd">2</button>

                <button class="5th">5</button>
